<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MONO Style Archive · 角色创作的卡牌素材库</title>
    <meta
      name="description"
      content="多元卡牌 × 主题卡包 × 自由组合，打造属于你的虚拟角色。收集角色、服装、发型、妆容、动作、场景、道具与风格特效卡，自由拼装生成新角色影像与社媒内容。"
    />
    <meta property="og:title" content="MONO Style Archive · 角色创作的卡牌素材库" />
    <meta
      property="og:description"
      content="COLLECT / COMBINE / CREATE — 多元卡牌 × 主题卡包 × 自由组合，打造属于你的虚拟角色。"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var src = (event && event.filename) || '';
          var stack =
            event && event.error && event.error.stack
              ? String(event.error.stack)
              : '';
          if (
            src.indexOf('chrome-extension://') === 0 ||
            stack.indexOf('chrome-extension://') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          var stack =
            event && event.reason && event.reason.stack
              ? String(event.reason.stack)
              : '';
          if (stack.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0B0C11] text-[#F1EEE8] antialiased selection:bg-[#E2BD75]/30 selection:text-[#FFF9ED]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
